# GRUB configuration for the UEFI boot path.
#
# One entry, and its KERNEL COMMAND LINE matches the BIOS path in
# syslinux-linux.cfg argument for argument. Two boot paths that boot
# differently is a difference nobody finds, because a given machine only
# ever offers one of them.
#
# WHAT THE TWO PATHS NO LONGER SHARE, AND WHY THAT IS ALLOWED
#     Their appearance. Everything below the command line - the theme,
#     the font, the background, the colour of the selected entry - has no
#     counterpart on the BIOS side: GRUB draws a gfxmenu described by
#     themes/zepos/theme.txt, and syslinux takes a background image and a
#     table of colour attributes and knows nothing of a theme file. There
#     is no arrangement in which the two are pixel-identical, and there
#     is no need for one - nobody sees both. What they DO share is the
#     brand: the same petrol, the same yellow on the selected entry, the
#     same wordmark, the same words. iso/profile-release/syslinux/
#     syslinux.cfg carries the other half of this note.
#
#     So the rule for the next person is: a change to what the medium
#     BOOTS has to be made in both files and stays checkable line by
#     line. A change to how it LOOKS has to be made in both files and can
#     only be compared by looking at the two pictures.
#
# WHAT IS DELIBERATELY NOT HERE is the `insmod serial` block the smoke
# image carries. That image reports its whole run over the serial line;
# this one is booted by a person looking at a screen, and a shipping
# medium has no business mirroring its console to a stranger's COM port.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

# EVERY LINE OF THIS BLOCK IS LOAD-BEARING, AND NONE OF IT FAILS LOUDLY
#
# GRUB answers a missing font, a missing theme file and an unreadable
# background by carrying on in text mode without an error. A boot menu
# that lost its identity therefore looks exactly like one that never had
# it, which is why the order below is the order it is:
#
#   1. `loadfont` on the font in the GRUB binary's own memdisk. It is
#      embedded by grub-mkstandalone (mkarchiso does not pass --fonts, so
#      the default `unicode` goes in) and reached through ${prefix},
#      which is (memdisk)/boot/grub - NOT the ISO. If this one fails, the
#      graphics stack is not there and nothing after it would work.
#   2. The modules. All five are in mkarchiso's grubmodules list and are
#      therefore already linked into the binary, so these are no-ops that
#      say what is being relied on. `png` is what reads the background
#      and `gfxmenu` is what draws the theme; without either, the menu
#      renders as plain text on the graphical terminal.
#   3. gfxterm, checked. `terminal_output gfxterm` can fail on firmware
#      that gives GRUB no usable video mode, and a failed switch with no
#      fallback is a screen with no terminal on it at all.
#   4. The brand fonts and the theme, off the ISO 9660 filesystem. $root
#      is the medium here - the configuration embedded in the EFI binary
#      sets it before it reaches this file - so /boot/grub is the copy
#      mkarchiso made of this profile's grub/ directory.
#
# The three fonts are loaded by PATH and used by NAME: theme.txt asks for
# "Roboto Regular 24" and GRUB matches that against the name inside the
# PF2, which is not derivable from the file name.
# tests/iso/test_boot_theme.py reads both and checks they still agree.
if loadfont "${prefix}/fonts/unicode.pf2"; then
    insmod all_video
    insmod font
    insmod gfxterm
    insmod gfxmenu
    insmod png

    set gfxmode="auto"
    terminal_input console

    if terminal_output gfxterm; then
        loadfont "/boot/grub/fonts/roboto-16.pf2"
        loadfont "/boot/grub/fonts/roboto-24.pf2"
        loadfont "/boot/grub/fonts/roboto-bold-24.pf2"
        set theme="/boot/grub/themes/zepos/theme.txt"
        export theme
    else
        terminal_output console
    fi
fi

default=zepos
timeout=10
timeout_style=menu

menuentry "ZepOS installieren (%ARCH%, UEFI)" --class arch --class gnu-linux --class gnu --class os --id 'zepos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% systemd.mask=getty@tty1.service
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Rechner ausschalten" --class shutdown --class poweroff {
    echo "Der Rechner wird ausgeschaltet ..."
    halt
}
