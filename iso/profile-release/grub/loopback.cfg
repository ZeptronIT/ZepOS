# Booting the image as a loopback file rather than as a medium.
#
# mkarchiso writes this into the image whenever a GRUB boot mode is
# built. It matters more here than on the smoke image: a multiboot USB
# stick that chainloads ISO files is a normal way for somebody to try a
# distribution, and it is the one path where the root device cannot be
# found by searching for the medium's UUID.

search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

# The same theme grub.cfg loads, reached differently and trusted less.
#
# This file is read by SOMEBODY ELSE'S GRUB - the one on the multiboot
# stick - so neither of the two things grub.cfg can rely on holds here.
# ${prefix} is that GRUB's prefix and says nothing about this image, and
# the modules below are not already linked into the binary: `insmod png`
# is a real load off the host's own /boot/grub, and on a host that has
# none it prints a line and carries on. That is the trade, and it is
# worth taking - the alternative is that the one path where a person
# tries ZepOS without writing a USB stick is the one path with no brand
# on it at all.
#
# What CAN be relied on is $root: the host set it to the loop-mounted
# image before reading this file, so /boot/grub below is this image's
# own copy of the theme and not the host's.
#
# UNPROVEN, and it says so rather than pretending. iso/test-boot.py's
# boot-menu scenario boots the medium as a medium, on both firmwares,
# and photographs what comes up; nothing here has ever booted this image
# out of a file on somebody else's stick. Whoever first does should
# expect either this menu or - if that host's GRUB has no png module on
# disk - one line of error and the plain text menu underneath it.
if loadfont "/boot/grub/fonts/roboto-24.pf2"; then
    insmod all_video
    insmod gfxterm
    insmod gfxmenu
    insmod png

    loadfont "/boot/grub/fonts/roboto-16.pf2"
    loadfont "/boot/grub/fonts/roboto-bold-24.pf2"

    if terminal_output gfxterm; then
        set theme="/boot/grub/themes/zepos/theme.txt"
        export theme
    fi
fi

default=zepos
timeout=10
timeout_style=menu

menuentry "ZepOS installieren (%ARCH%, Loopback)" --class arch --class gnu-linux --class gnu --class os --id 'zepos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" systemd.mask=getty@tty1.service
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}
