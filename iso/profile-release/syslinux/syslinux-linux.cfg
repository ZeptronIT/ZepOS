LABEL zepos
MENU LABEL ZepOS installieren (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
# No console= at all, and that is the difference from the smoke image.
#
# The harness appends console=ttyS0,115200 because a serial line is the
# only channel that survives a boot dying before userspace, and because
# its collector reports the whole run over it. On this image there is
# nothing to report to and nobody listening: a serial console on a
# shipping medium sends the boot of a stranger's machine - and every
# password prompt on it - to whatever is wired to its COM port, and slows
# the boot to 115200 baud while doing it.
#
# Without console= the kernel uses the machine's own default, which is
# the screen the user is looking at.
#
# systemd.mask=getty@tty1.service, and why it is HERE rather than a
# symlink to /dev/null in the profile:
#
#     The installer owns tty1 (see zepos-install.service), and a getty on
#     the same screen makes both unreadable. Masking it with a file works
#     - it was built and booted that way once - but the mask is in place
#     while pacstrap runs, and systemd's own post-install scriptlet then
#     fails with "Failed to enable unit: ... is masked", which pacman
#     reports as "error: command failed to execute correctly". An error
#     in the build log of a release is a thing somebody has to be told to
#     ignore, and next time they will ignore the real one.
#
#     systemd reads this at startup and masks the unit at run time, in
#     /run, where no package can trip over it. The unit also declares
#     Conflicts=getty@tty1.service, so the mask is the belt and that is
#     the braces.
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% systemd.mask=getty@tty1.service
