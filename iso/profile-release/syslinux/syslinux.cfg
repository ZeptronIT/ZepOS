# The BIOS boot menu, and the other half of the note in
# iso/profile-release/grub/grub.cfg.
#
# WHY THIS LOOKS LIKE THE UEFI MENU AND CANNOT BE THE SAME AS IT
#     GRUB draws a gfxmenu out of a theme file: components with
#     percentage geometry, a scaled PNG behind them, a PF2 font at a
#     chosen size, a nine-slice pixmap behind the selected entry.
#     syslinux has none of those words. It takes ONE background image at
#     one fixed resolution, lays text out in character cells of a font it
#     brings itself, and colours each element with a foreground and a
#     background in #AARRGGBB. The two mechanisms have nothing in common
#     but the pixels they end up producing.
#
#     So the two menus are the same BRAND and not the same picture: the
#     same petrol, the same wordmark, the same brand yellow behind the
#     selected entry, the same words. A machine offers one firmware or
#     the other and never both, so nobody is ever in a position to
#     compare them - what matters is that neither of them is the one that
#     looks like nothing.
#
#     What still has to match line by line is the KERNEL COMMAND LINE.
#     That lives in syslinux-linux.cfg and is checked against grub.cfg's,
#     by hand and by iso/test-boot.py's image inspection.
#
# vesamenu.c32 AND NOT menu.c32
#     menu.c32 is the text-mode menu: it can colour characters and it
#     ignores MENU BACKGROUND entirely. Everything below the colours here
#     needs the graphical one. Both are installed by mkarchiso, which
#     copies the whole of /usr/lib/syslinux/bios/*.c32, so this costs no
#     new file in the image.
UI vesamenu.c32

# 800x600, and the background image is exactly 800x600 for that reason.
#
# syslinux does not scale MENU BACKGROUND: the image is drawn at its own
# size, so an image that does not match the mode is an image in the
# corner of a screen. 800x600 is a mode every VESA BIOS since 1995 has,
# and it is the largest one that can be relied on that far back - the
# next step up is where "the firmware picked something else" starts.
MENU RESOLUTION 800 600
MENU BACKGROUND splash.png

# Where the text sits on that picture, in character cells. The vesamenu
# font is 8x16, so 800x600 is 100 columns by 37 rows, and the numbers
# below put each element where the GRUB theme's percentage puts it: the
# menu at 41% is row 15, the countdown at 78% is row 29, the help line at
# 86% is row 32. The splash was drawn to the same fractions, which is why
# its top third is the wordmark and the rest is empty petrol.
#
# MEASURED, AND THE REASON THE NUMBERS BELOW LOOK WRONG
#     TABMSGROW, TIMEOUTROW and HELPMSGROW are RELATIVE TO VSHIFT.
#     syslinux's menumain.c adds VSHIFT to each of them; only MENU ROWS
#     and HELPMSGENDROW are absolute. Written as absolute rows - 29 and
#     32, the numbers this menu wants - they became 42 and 45 on a screen
#     with 37 rows, and the run that measured it had the countdown
#     clamped to the bottom edge and no help line on the screen at all.
#     So each one below is the absolute row it should appear on, minus
#     the VSHIFT above it.
MENU HSHIFT 19
MENU WIDTH 62
MENU MARGIN 1
MENU VSHIFT 13
MENU ROWS 2
MENU TIMEOUTROW 16
MENU TABMSGROW 19
MENU HELPMSGROW 21
MENU HELPMSGENDROW 36

# No MENU TITLE. The picture behind this already carries the wordmark and
# the product name, twice as large as a row of cells can be, and a title
# row would print "ZepOS" a third time.

# German, because everything a person reads on this medium is. syslinux's
# own default here is "Automatic boot in # second{,s}..." - English, on a
# German menu, and the one line on the screen that changes every second
# and therefore the one the eye goes to. `#` is the count and the braces
# are singular/plural.
MENU AUTOBOOT Automatischer Start in # Sekunde{,n} ...

# The same sentence the UEFI menu puts under its menu, with the one word
# that has to differ: syslinux edits an entry on Tab and GRUB on `e`.
# No umlaut in it, deliberately - see the label in
# grub/themes/zepos/theme.txt for the argument.
MENU TABMSG Pfeiltasten bewegen die Auswahl  |  Eingabetaste startet  |  Tab bearbeitet die Startoptionen

# THE COLOURS. src/brand.py, and measured rather than chosen:
#
#   #DCEEF4 on #0D3D47   9.90:1   an entry, on the petrol of the splash
#   #0D3D47 on #FFCB00   7.77:1   the SELECTED entry, on the brand yellow
#   #A9C6CF on #0D3D47   6.57:1   the help line and the countdown text
#   #FFCB00 on #0D3D47   7.77:1   the seconds left
#
# tests/iso/test_boot_theme.py parses these lines and recomputes all four
# against WCAG AA rather than trusting the comment.
#
# Every background that is not the selected entry's is #00000000 -
# transparent - and that is not a colour, it is what lets the splash
# show through: an opaque background here is painted over every
# character cell, which on a full-screen menu means over the whole
# picture. The petrol the ratios above are computed against is therefore
# the SPLASH's petrol, which is why the middle of that image is flat
# brand colour and nothing else.
#
#            element        ansi        foreground  background  shadow
MENU COLOR screen           37;40       #FFDCEEF4   #00000000   none
# Transparent on transparent, which draws nothing. vesamenu puts a
# single-line frame around the entries and GRUB's boot_menu does not; a
# frame here and none there is the two paths differing for no reason
# anybody chose. The entries sit on the splash's petrol on both.
MENU COLOR border           30;44       #00000000   #00000000   none
MENU COLOR title            1;33;40     #FFFFCB00   #00000000   none
MENU COLOR unsel            37;40       #FFDCEEF4   #00000000   none
MENU COLOR hotkey           1;33;40     #FFFFCB00   #00000000   none
MENU COLOR sel              7;30;43     #FF0D3D47   #FFFFCB00   none
MENU COLOR hotsel           1;7;30;43   #FF0D3D47   #FFFFCB00   none
MENU COLOR disabled         1;30;40     #FF8FB0BA   #00000000   none
# The raw brand cyan, at 3.45:1 on the petrol. It is a shape and not
# text, so WCAG 1.4.11's 3:1 for a user interface component is the line
# it has to clear - and #214F59, which is what a scrollbar in the darkest
# brand shade would have been, is 1.31:1 and invisible. Two entries can
# never produce a scrollbar; a colour that is only right while it is
# never drawn is not right.
MENU COLOR scrollbar        30;40       #FF0096C0   #00000000   none
MENU COLOR tabmsg           31;40       #FFA9C6CF   #00000000   none
MENU COLOR help             37;40       #FFA9C6CF   #00000000   none
MENU COLOR timeout_msg      37;40       #FFA9C6CF   #00000000   none
MENU COLOR timeout          1;33;40     #FFFFCB00   #00000000   none
MENU COLOR cmdmark          1;36;40     #FF33C9EE   #00000000   none
MENU COLOR cmdline          37;40       #FFDCEEF4   #00000000   none
MENU COLOR msg07            37;40       #FFDCEEF4   #00000000   none

MENU CLEAR

DEFAULT zepos
# Tenths of a second, not seconds: ten. The smoke image sets 10 here,
# which is one second - correct for a machine nobody is sitting at and
# far too short for a person who has just been handed a USB stick.
TIMEOUT 100

INCLUDE syslinux-linux.cfg

# The second entry, which this menu did not have and the UEFI one did.
#
# Found while the two menus were being put side by side for the first
# time: grub.cfg offers "ZepOS installieren" and "Rechner ausschalten",
# this file offered the first alone, and the difference had never been
# visible because no machine shows both menus. A person who boots the
# medium by accident, or who changes their mind, has to be able to leave
# it without reaching for the power switch - on either firmware.
#
# poweroff.c32 comes from the syslinux package, which mkarchiso already
# copies whole (/usr/lib/syslinux/bios/*.c32), so this costs no new file
# in the image. It is HERE and not in syslinux-linux.cfg because that
# file is the kernel command line and nothing else - the half of the two
# boot paths that still has to match argument for argument.
LABEL poweroff
MENU LABEL Rechner ausschalten
COM32 poweroff.c32
