# iwd's own network configuration, switched on.
#
# REPORTED FROM THE MEDIUM, 10.08.2026: "wlan netzwerkxxx verbunden aber
# es wurde keine verbindung zum internet gefunden".
#
# WHY IT HAPPENED
#     Associating with a network and having an address on it are two
#     different things. The medium enabled iwd.service and nothing else:
#     no systemd-networkd, no dhcpcd, no NetworkManager - so the radio
#     link came up, the installer reported the network as joined, and
#     nobody ever asked for an IP address. Every reachability check
#     after that was answering a question about a machine with no
#     address on the network it had just joined.
#
#     iwd can do this itself, and does not by default: EnableNetwork-
#     Configuration is off unless something turns it on. On a medium
#     that ships exactly one network daemon, that something has to be
#     this file.
#
# WHY iwd AND NOT ANOTHER DAEMON
#     It is already here and already the one the installer drives. A
#     second daemon for the addresses would be a second thing to enable,
#     a second thing to fail and a second place to look - on a medium
#     whose whole job is to run one installer.
[General]
EnableNetworkConfiguration=true

# WHICH SERVICE RESOLVES NAMES, and this line was wrong once already.
#
# It said "resolvconf" for one build, and there is no resolvconf on this
# medium - only systemd-resolved, which was present and not started. iwd
# therefore had nowhere to put the nameservers it got from DHCP: the
# machine had an address and a route and could not turn a name into one.
# archinstall then sat in mirror lookups until they timed out, which is
# what "haengt bei starting device modifications" looked like from the
# outside.
#
# So: systemd, and iso/profile-release/airootfs/etc/systemd/system/
# sysinit.target.wants/systemd-resolved.service starts it -
# WantedBy=sysinit.target is what its own [Install] section asks for,
# not multi-user. /etc/resolv.conf points at the stub resolved answers
# on, because a file that is not a link to it is a file resolved does
# not write.
[Network]
NameResolvingService=systemd
