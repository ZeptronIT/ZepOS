# The console keymap, matching kb_layout = de in
# hyprland-universal-config.template. Two layers, one answer: a rescue
# shell on tty2 that maps keys differently from the session on tty1 is a
# trap for whoever is debugging a failed run at 2am.
#
# It is also one of the five questions systemd-firstboot would ask on a
# machine that cannot answer any of them - see the mask on
# systemd-firstboot.service next to this file.
KEYMAP=de
