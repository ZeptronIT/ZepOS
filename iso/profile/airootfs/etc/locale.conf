# C.UTF-8, not de_DE.UTF-8.
#
# What the image has to get right is UTF-8: the whole icon layer is Nerd
# Font glyphs, and a non-UTF-8 locale turns a screenshot of the bar into
# a screenshot of question marks. Which language the messages come out in
# is not what this image measures, and a real locale would mean shipping
# /etc/locale.gen and running locale-gen for no gain here.
LANG=C.UTF-8
