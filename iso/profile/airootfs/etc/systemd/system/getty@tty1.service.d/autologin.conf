# Log the live user in on tty1 without asking for a password.
#
# The account systemd-sysusers creates has a locked password field; that
# is not an obstacle, because agetty --autologin hands over to `login
# -f`, which skips authentication entirely. It is also the reason no
# password ends up in the image.
#
# This is the only entry point into the smoke run: ~zepos/.bash_profile
# takes over from here, and it checks that it really is on tty1 before it
# does anything.
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --autologin zepos --noclear %I 38400 linux
