# The live user the desktop runs as.
#
# WHY NOT SHIP /etc/passwd
#     A profile that ships its own /etc/passwd overwrites the one the
#     filesystem package brings and every account systemd-sysusers adds
#     for dbus, polkitd and the rest. sysusers.d is additive: pacstrap
#     installs systemd, systemd's own sysusers files trip the
#     30-systemd-sysusers hook, and that hook runs `systemd-sysusers`
#     with no arguments - which processes /etc/sysusers.d as well. The
#     account therefore exists by the time the image is finished, and
#     iso/build.sh asserts exactly that against the built rootfs rather
#     than trusting the chain.
#
# WHY NOT RUN AS ROOT
#     archiso's own profiles autologin root, and it would have been one
#     line less. But ZepOS's configuration model is per-user by
#     construction (spec §5): the generator writes below ~/.config, the
#     settings file lives there, /etc/skel seeds it. A session that only
#     ever runs as root would leave the whole ownership question - which
#     is where a first boot actually fails - untested.
#
# The id is pinned to 1000 because profiledef.sh's file_permissions
# chowns /home/zepos numerically, before this account exists. Two places,
# one number; the test suite checks they agree.
#
# A bare id rather than "1000:1000": with UID:GID sysusers.d requires the
# group to exist already, whereas a `u` line with one number creates the
# matching group at the same id itself.
u zepos 1000 "ZepOS live session" /home/zepos /bin/bash

# So that the evidence collector can read `journalctl -b`. Without the
# membership journalctl silently shows the user's own journal only, and
# a boot that failed in a system unit leaves no trace in the evidence -
# the one case where the journal is the whole answer.
m zepos systemd-journal

# The two channels the evidence leaves through, and neither is writable
# by an ordinary user on Arch:
#
#   /dev/ttyS0   root:uucp 0660   udev's rule for tty[A-Z]*[0-9]
#   /dev/vda     root:disk 0660   udev's rule for block devices
#
# Measured, on a run that reached "Started Getty on tty1" and then went
# silent for ten minutes: the session was up, the smoke script was
# running, and every one of its progress lines was being dropped by a
# permission error its own `2>/dev/null` swallowed. The evidence disk
# would have failed the same way at the end.
#
# Group membership rather than a udev rule loosening the modes: it names
# the user who gets the access instead of granting it to everyone, and it
# is one line in the file that already creates that user.
m zepos uucp
m zepos disk
