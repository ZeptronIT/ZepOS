#
# pacman.conf for the ZepOS smoke image.
#
# The two repository sections point at an Arch Linux Archive snapshot
# instead of at a mirror list. Spec §8.7 asks for exactly this: two
# builds of the same commit have to produce the same system, or a bug
# report from a user cannot be reproduced. A mirror list makes the
# contents of the image a function of the day it was built.
#
# The snapshot date is committed rather than passed in, because a pin
# that lives in somebody's shell history is not a pin. iso/build.sh
# --snapshot rewrites it in the build's working copy for the one case
# that needs it: finding out whether a newer Arch has fixed something.
#
# Note that this pins the IMAGE. The container that runs mkarchiso is
# pinned separately - see iso/Dockerfile - and its package versions are
# recorded next to the ISO by iso/build.sh.
#

[options]
HoldPkg      = pacman glibc
Architecture = auto
ParallelDownloads = 5

# We cannot check disk space from within a chroot environment
#CheckSpace

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://archive.archlinux.org/repos/2026/08/04/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/08/04/$repo/os/$arch

# The ZepOS packages, out of the repository packaging/build.sh produced.
#
# The path is where iso/build.sh mounts packaging/out/ INSIDE THE BUILD
# CONTAINER; it exists for the duration of one pacstrap and nowhere else.
# It is not the path an installed system uses - installer/core/source.py
# has those two: https://zeptronit.github.io/ZepOS/$arch when there is a
# network, file:///opt/zepos-repo when there is not.
#
# SigLevel is the strict one, on purpose. Spec §8.6: a repository that
# starts unsigned makes every system installed from it import a key by
# hand on the day it stops being unsigned. iso/build.sh imports the
# public half into the build container's pacman keyring before pacstrap
# runs, and relaxes this line in its working copy - loudly - only when
# the repository was built with --no-sign.
[zepos]
SigLevel = Required DatabaseOptional
Server = file:///zepos-repo/$arch
