LABEL zepos
MENU LABEL ZepOS smoke test (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
# console=tty0 first, console=ttyS0 last: the LAST console on the command
# line becomes /dev/console, so systemd's own progress lands in the
# harness's serial log while the kernel still paints tty0. Without the
# serial console a boot that dies before the smoke script runs leaves no
# evidence at all - which is precisely the failure mode this image was
# built to catch.
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0 console=ttyS0,115200
