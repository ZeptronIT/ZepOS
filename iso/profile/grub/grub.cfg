# GRUB configuration for the UEFI boot path.
#
# Kept to the one entry this image has. The kernel command line matches
# the BIOS path in syslinux-linux.cfg down to the console arguments: a
# UEFI boot that behaves differently from a BIOS boot is a difference
# nobody would find, because the harness only drives one of them.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

if loadfont "${prefix}/fonts/unicode.pf2"; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output console
fi

insmod serial
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

default=zepos
timeout=10
timeout_style=menu

menuentry "ZepOS smoke test (%ARCH%, UEFI)" --class arch --class gnu-linux --class gnu --class os --id 'zepos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0 console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}
