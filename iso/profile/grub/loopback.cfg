# Booting the ISO as a loopback file rather than as a medium.
#
# mkarchiso writes this into the image whenever a GRUB boot mode is
# built, so it exists here because the build wants it, not because the
# smoke harness uses it. It differs from grub.cfg in one respect: the
# root device is found through the loop file that GRUB was pointed at,
# not by searching for the ISO's UUID on real media.

search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

default=zepos
timeout=10
timeout_style=menu

menuentry "ZepOS smoke test (%ARCH%, loopback)" --class arch --class gnu-linux --class gnu --class os --id 'zepos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" console=tty0 console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}
