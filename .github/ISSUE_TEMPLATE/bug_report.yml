name: Bug report
description: Something in ZepOS behaves differently than it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ZepOS is pre-release software. Before filing, please check the
        [status section](https://github.com/ZeptronIT/ZepOS#status-pre-release-please-read-this-part)
        of the README - several rough edges are already written down there,
        including Secure Boot, the test signing key and the update channel.

        **Do not report security problems here.** See
        [SECURITY.md](https://github.com/ZeptronIT/ZepOS/blob/main/SECURITY.md).

  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Installation medium / boot
        - Installer (graphical)
        - Installer (text mode)
        - Desktop session (Hyprland, bar, dock)
        - Login screen / lock screen
        - Configuration generation (zepos-generate)
        - Settings (zepos-settings / settings app)
        - Package build (packaging/build.sh)
        - ISO build (iso/build.sh)
        - Something else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >-
        What you did, what you expected, and what you got instead. If a
        command is involved, paste the exact command line and its output.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The shortest sequence that shows the problem.
      placeholder: |
        1. Boot the medium from release ...
        2. Choose ...
        3. The installer shows ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ZepOS version
      description: >-
        The ISO file name, the release tag, or - on an installed system -
        the output of `pacman -Q zepos-config`. On a checkout, the commit
        hash from `git rev-parse --short HEAD`.
      placeholder: "zepos-2026.08.10-x86_64.iso"
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware and firmware
      description: >-
        Machine, GPU, and whether you booted UEFI or BIOS, with or without
        Secure Boot. Write "QEMU" if it is a virtual machine.
      # No real machine here. This placeholder is shown to every visitor
      # of a public issue form, and the model it named was the
      # maintainer's own laptop - the same machine whose hostname was
      # removed from the templates on 17.08.2026.
      placeholder: "Laptop model, GPU, UEFI or BIOS, Secure Boot on or off"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Where it applies: `zepos-doctor`, `journalctl -b -p warning`, the
        installer log shown on its last page, or the output of
        `Hyprland --verify-config`. Paste as text, not as a screenshot of
        text.
      render: shell
