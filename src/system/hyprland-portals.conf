# Welcher Portalanbieter welche Schnittstelle beantwortet
# Erzeugt von ZepOS - NICHT DIREKT BEARBEITEN!
# Installiert nach /etc/xdg-desktop-portal/hyprland-portals.conf
#
# Ein Portal ist die Klappe, durch die eine Anwendung nach draussen
# greift: "oeffne eine Datei", "teile meinen Bildschirm", "lass den
# Schirm wach". Der Vorderbau xdg-desktop-portal nimmt die Bitte an und
# reicht sie an einen ANBIETER weiter. Welchen, stand bis zum 22.08.2026
# in keiner Datei dieses Baums - und "in keiner Datei" heisst nicht
# "egal", sondern "der Anbieter entscheidet es fuer uns".
#
# WARUM NICHT NACH /usr/share/xdg-desktop-portal/
#     Weil dieser Pfad dem Paket xdg-desktop-portal-hyprland gehoert: es
#     liefert dort selbst eine hyprland-portals.conf aus. Zwei Pakete auf
#     einem Pfad sind in pacman ein Dateikonflikt, und der bricht die
#     Installation ab, statt sie nur zu verfaerben. Denselben Weg gehen
#     aus demselben Grund schon zwei andere Stellen dieses Projekts:
#     packaging/zepos-desktop/PKGBUILD unter hyprland-qtutils, und
#     src/login/greetd.toml, das neben /etc/greetd/config.toml liegt
#     statt darauf.
#
#     Dass /etc der richtige Platz IST und nicht nur der freie, ist
#     gemessen und nicht angenommen. GEMESSEN am 22.08.2026 mit
#     `/usr/lib/xdg-desktop-portal --verbose` auf einem eigenen
#     Sitzungsbus; der Vorderbau schreibt jeden Ort hin, den er absucht:
#
#          1  $XDG_CONFIG_HOME/xdg-desktop-portal/hyprland-portals.conf
#          3  /etc/xdg/xdg-desktop-portal/hyprland-portals.conf
#          5  /etc/xdg-desktop-portal/hyprland-portals.conf     <- hier
#         15  /usr/share/xdg-desktop-portal/hyprland-portals.conf
#
#     Platz 5 vor Platz 15: diese Datei gewinnt gegen die des fremden
#     Pakets, ohne sie anzufassen. Der Nutzer wiederum gewinnt gegen
#     diese hier, ueber Platz 1 - deshalb steht sie in backup= des
#     Rezepts und nicht unter /usr/share.
#
# WAS OHNE SIE GALT, UND WAS DAS GEKOSTET HAT
#     Ohne eigene Datei gewann die des Anbieters:
#         [preferred]
#         default=hyprland;gtk
#     Zwei Fehler, beide am 22.08.2026 auf der laufenden Maschine
#     gemessen, keiner davon sichtbar als Fehler.

[preferred]
# Unveraendert. hyprland steht vorn, also bleiben Screenshot, ScreenCast,
# GlobalShortcuts und InputCapture da, wo sie hingehoeren - beim
# Compositor, der als einziger weiss, was auf dem Schirm steht. gtk
# dahinter faengt alles ab, was hyprland nicht fuehrt.
#
# gnome steht hier ABSICHTLICH NICHT, obwohl das Paket installiert ist.
# Eine Zeile `default=hyprland;gnome;gtk` haette gnome ein Dutzend
# Schnittstellen zugeschoben, von denen keine gemessen ist - darunter
# RemoteDesktop, das gnome fuehrt und das seine Arbeit an mutter
# weitergibt, den es hier nicht gibt. Was gnome bekommt, steht unten
# namentlich und einzeln.
default=hyprland;gtk

# ---------------------------------------------------------------------
# FEHLER 1: der Dateidialog war der alte, und niemand konnte es sehen
# ---------------------------------------------------------------------
# packaging/zepos-apps/PKGBUILD nimmt xdg-desktop-portal-gnome 50.0-1
# ausdruecklich auf, und schreibt den Grund dazu: der Dialog "Datei
# oeffnen" gehoert dem Portal und nicht dem Programm, das ihn ruft, und
# xdg-desktop-portal-gtk zeichnet ihn in GTK3 - "der eine Dialog, den
# jede Anwendung teilt, war der eine, der die Marke nicht trug".
#
# In `default=hyprland;gtk` kommt gnome nicht vor. GEMESSEN am
# 22.08.2026 auf der laufenden Sitzung:
#
#     systemctl --user is-active xdg-desktop-portal-gnome.service
#         inactive
#     journalctl --user -u xdg-desktop-portal-gnome.service --since -7d
#         -- No entries --
#     systemctl --user is-active xdg-desktop-portal-gtk.service
#         active
#
# Sieben Tage, kein einziger Start. Und es gibt auch keinen Rueckfall,
# der das aufgefangen haette: portals.conf(5) kennt dafuer nur den
# Sonderwert `*` ("das erste gefundene"); eine namentliche Liste heisst
# genau diese Namen. Das Paket war gekauft und wurde nie gefragt.
#
# `gnome;gtk` und nicht `gnome`: wer zepos-desktop ohne zepos-apps
# installiert, hat kein xdg-desktop-portal-gnome. Stuende hier nur
# `gnome`, haette diese Maschine dann GAR KEINEN Dateidialog - eine
# Verschlechterung gegenueber heute, ausgeloest von einer Datei, die
# etwas verbessern soll. gtk dahinter ist die Rueckwand.
#
# ---------------------------------------------------------------------
# UND SEIT DEM 03.09.2026 STEHT gnome NICHT MEHR VORN
# ---------------------------------------------------------------------
# Der Nutzer: "dialoge um den pfad mit dateien anzugeben oder andere
# dialog erscheinen garnicht erst". Der Verdacht auf gnome ist nicht
# bewiesen - er ist aber der einzige, der zu "gar kein Fenster" passt,
# und drei Belege zeigen in dieselbe Richtung:
#
#   1. /usr/share/xdg-desktop-portal/portals/gnome.portal beansprucht
#      org.freedesktop.impl.portal.FileChooser UND traegt `UseIn=gnome`.
#      Der Anbieter sagt selbst, fuer welche Sitzung er gedacht ist, und
#      diese heisst Hyprland.
#   2. Die Messung, die zwanzig Zeilen weiter oben steht: sieben Tage,
#      kein einziger Start von xdg-desktop-portal-gnome.service. Sie war
#      der Grund fuer diese Zeile - sie ist genauso ein Grund gegen sie.
#   3. portals.conf(5) kennt fuer den Rueckfall nur den Sonderwert `*`.
#      Eine namentliche Liste heisst genau diese Namen, und ein Anbieter,
#      der ZUR LAUFZEIT scheitert, ist etwas anderes als einer, der
#      fehlt: die Bitte endet dann mit einem Fehler und nicht beim
#      naechsten Namen. Genau das sieht aus wie "gar kein Fenster".
#
# WAS DIESE ZEILE NICHT BEHEBT, und das gehoert dazu: den Wähler der
# AGS-Oberflaeche. Die Hyprland-Konfiguration setzt
# `env = GTK_USE_PORTAL,0`, damit nimmt GTK4 seinen EIGENEN Dialog und
# fragt gar kein Portal. Fuer Gtk.FileDialog in ags-overlay-utils.ts ist
# diese Datei wirkungslos - die Reparatur dort steht dort. Was hier
# haengt, ist jede ANDERE Anwendung: Firefox, Electron, alles unter
# Flatpak, alles, was den Portalweg wirklich geht.
#
# Der GTK4-Dialog bleibt das Ziel und kommt zurueck, sobald GEMESSEN ist,
# dass gnome unter Hyprland antwortet. Ein schoener Dialog, der nie
# aufgeht, ist schlechter als ein alter, der aufgeht.
org.freedesktop.impl.portal.FileChooser=gtk

# ---------------------------------------------------------------------
# FEHLER 2: der Schirm schlief waehrend eines Videoanrufs ein
# ---------------------------------------------------------------------
# GEMESSEN am 22.08.2026, dreimal an EINEM Vormittag im Protokoll des
# Nutzers (journalctl --user -u xdg-desktop-portal.service):
#
#     08:10:31  A backend call failed: Inhibiting other than idle not supported
#     08:37:40  A backend call failed: Inhibiting other than idle not supported
#     08:47:36  A backend call failed: Inhibiting other than idle not supported
#
# Eine Anwendung bittet darum, wach zu bleiben; die Bitte landet bei gtk;
# dessen Umsetzung spricht org.gnome.SessionManager, den es unter
# Hyprland nicht gibt. Der Anruf laeuft, und der Schirm geht aus.
#
# `none` und nicht "ein anderer Anbieter": ES GIBT KEINEN. Weder
# hyprland noch gnome fuehren impl.portal.Inhibit (nachgesehen in den
# .portal-Dateien beider Pakete). `none` heisst: der Vorderbau bietet
# org.freedesktop.portal.Inhibit gar nicht erst an - und GENAU DAS ist
# die Reparatur, weil eine Anwendung, die das Portal nicht findet, auf
# das Wayland-Protokoll zurueckfaellt, das der Compositor selbst fuehrt.
#
# Dass Hyprland es fuehrt, ist der Angelpunkt und deshalb gemessen und
# nicht geglaubt - waere es nicht so, machte `none` es schlimmer:
#
#     Hyprland 0.56.2, `strings`:      zwp_idle_inhibit_manager_v1
#     /usr/include/hyprland/protocols/idle-inhibit-unstable-v1.hpp
#     und die LAUFENDE Instanz bietet es an, aus ihrem eigenen Protokoll
#     vom 01.09.2026 08:03:15:
#         xdg-desktop-portal-hyprland: Got interface:
#             zwp_idle_inhibit_manager_v1 (ver 1)
#
# Denselben Eintrag aus demselben Grund traegt /usr/share/
# xdg-desktop-portal/sway-portals.conf seit Jahren, mit der Begruendung
# woertlich daneben: "xdg-desktop-portal-gtk's implementation uses
# org.gnome.SessionManager and org.freedesktop.ScreenSaver, neither of
# which is implemented by Sway. This will cause some programs (e.g.
# Firefox) to use Wayland's idle-inhibit protocol instead".
org.freedesktop.impl.portal.Inhibit=none

# ---------------------------------------------------------------------
# WAS GNOME AUSDRUECKLICH NICHT BEKOMMT: Settings
# ---------------------------------------------------------------------
# Settings traegt kein Fenster, sondern Zahlen - unter anderem die
# Antwort auf "hell oder dunkel". Es waere die naheliegende dritte Zeile
# und steht bewusst nicht hier.
#
# Die Sorge, gnome koennte anders antworten als der Rest des Systems,
# ist GEMESSEN und hat sich NICHT bestaetigt. Beide Anbieter auf einem
# eigenen Sitzungsbus, mit eigenem XDG_CONFIG_HOME und keyfile-Backend,
# also ohne die dconf-Datenbank des Nutzers zu lesen oder zu schreiben
# (22.08.2026), org.freedesktop.appearance/color-scheme:
#
#     gsettings-Wert     GTK    GNOME
#     'default'           0       0
#     'prefer-dark'       1       1
#     'prefer-light'      2       2
#
# Identisch in allen drei Zustaenden, und das ist kein Zufall: beide
# lesen denselben Schluessel org.gnome.desktop.interface color-scheme,
# den src/templates/gtk-theme-fix-config.template setzt.
#
# Der Grund, es TROTZDEM bei gtk zu lassen, ist ein anderer: gnome
# antwortet ein SUPERSET. Es liefert zusaetzlich
#
#     accent-color   (ddd) 0.207843 0.517647 0.894118   = #3584E4
#
# das GNOME-Blau. ZepOS setzt seinen Akzent selbst und auf etwas
# anderes - STYLE_GTK4_ACCENT_BG ist THEME.CYAN
# (src/style_definition.py:1675, angewandt in
# src/templates/gtk4-colors-config.template:160). Ein Portal, das eine
# Frage beantwortet, die dieses Projekt an anderer Stelle schon
# beantwortet, ist eine zweite Quelle fuer einen Wert - und die Regel,
# die dieser Baum ueberall sonst befolgt, ist: EINE Quelle.
#
# Also: gnome fuer die Flaechen, die man SIEHT. gtk fuer die Zahlen.
# Das steht hier als Kommentar und nicht als Zeile, weil `default`
# bereits `hyprland;gtk` sagt und gnome damit gar nicht in Frage kommt.
# Wer diese Datei spaeter auf `default=hyprland;gnome;gtk` umstellt,
# muss dann eine Zeile
#     org.freedesktop.impl.portal.Settings=gtk
# dazuschreiben - dieser Absatz ist der Grund dafuer.
