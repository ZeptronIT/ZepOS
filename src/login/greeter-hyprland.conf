# Der Compositor der Anmeldung - installiert nach
# /etc/greetd/zepos-greeter-hyprland.conf
#
# WARUM HIER UEBERHAUPT EIN COMPOSITOR STEHT UND NICHT MEHR cage
#     GEMELDET am 01.09.2026: der Anmeldebildschirm verschwindet, sobald
#     ein zweiter Monitor angesteckt wird. Der Nutzer sah einen schwarzen
#     Schirm ohne Anmeldung und kam nur ueber das GRUB-Menue zurueck ins
#     System. Das ist kein Schoenheitsfehler, das ist ein Rechner, den
#     man nicht mehr benutzen kann.
#
#     DIE URSACHE, GEMESSEN am selben Tag: src/bin/zepos-greeter rief
#     `cage -s -d -- ...`. `cage -h` der Fassung 0.3.1-1 kennt genau zwei
#     Betriebsarten:
#
#         -m extend  Extend the display across all connected outputs (default)
#         -m last    Use only the last connected output
#
#     Es stand kein -m da, also galt `extend`: cage baut aus ALLEN
#     Ausgaengen eine gemeinsame Flaeche, und regreets einziges Fenster
#     sitzt am Ursprung dieser Flaeche - also auf dem ersten Ausgang.
#     Kommt ein Schirm dazu, aendert sich die Anordnung, und die
#     Anmeldung liegt auf einem Schirm, auf den niemand schaut.
#
#     Die drei Rueckfaelle in src/bin/zepos-greeter halfen nicht, und das
#     ist der unangenehme Teil: cage ist nicht GESCHEITERT. Es hat getan,
#     was seine Vorgabe sagt. Ein Rueckfall, der am Rueckgabewert haengt,
#     kann eine richtig ausgefuehrte falsche Entscheidung nicht bemerken.
#
#     Der Nutzer hat zwischen drei Wegen gewaehlt und gesagt: "Nur den
#     echten Fix, dafuer richtig" - Hyprland statt cage, und die
#     Anmeldung auf ALLEN Schirmen zugleich. Und dazu: "Kein Notausgang",
#     also KEINE Umschaltung auf den Textgreeter nach Zeitablauf. Die
#     vorhandenen Rueckfaelle ueber einen tatsaechlich gescheiterten
#     Start bleiben; src/bin/zepos-greeter fuehrt sie.
#
# WARUM DIESE DATEI NICHT DIE DES NUTZERS IST
#     ~/.config/hypr/hyprland.conf gehoert dem angemeldeten Menschen und
#     entsteht aus src/templates/hyprland-universal-config.template. Zum
#     Zeitpunkt der Anmeldung ist niemand angemeldet: der Greeter laeuft
#     als Benutzer "greeter", und was dort einmal steht, gilt fuer JEDE
#     Anmeldung auf dieser Maschine. Diese Datei ist deshalb eine eigene,
#     sie gehoert root, und src/bin/zepos-greeter zeigt Hyprland mit
#     `-c` darauf.
#
#     `-c` ist der Schalter, der das kann: src/main.cpp:120-146 des
#     ausgelieferten Hyprland 0.56.1 nimmt "-c"/"--config", prueft mit
#     std::filesystem::canonical, dass es eine gewoehnliche Datei ist,
#     und legt sie in m_explicitConfigPath ab. Jeremy.cpp:19-54 fragt
#     genau dieses Feld VOR HYPRLAND_CONFIG und vor der Suche in
#     XDG_CONFIG_HOME. Der Greeter kann also nicht versehentlich die
#     Datei eines Benutzers erwischen.
#
#     Der Name traegt wieder ein zepos-, aus demselben Grund wie
#     zepos.toml und zepos-regreet.toml daneben: zwei Pakete auf einem
#     Pfad sind in pacman ein Dateikonflikt. Die Begruendung steht
#     ausgeschrieben in src/login/greetd.toml.
#
# WARUM .conf UND NICHT .lua
#     Hyprland 0.56 bringt einen zweiten, Lua-basierten Konfigurations-
#     leser mit. Er waere hier NICHT benutzbar, und das ist gemessen:
#     src/debug/HyprCtl.cpp:1160-1163 beginnt dispatchKeyword mit
#
#         if (Config::mgr()->type() != Config::CONFIG_LEGACY)
#             return "keyword can't work with non-legacy parsers. Use eval.";
#
#     `hyprctl keyword monitor ...` ist aber genau der Weg, auf dem
#     src/bin/zepos-greeter-spiegel die Spiegelung setzt. Eine
#     Lua-Konfiguration nimmt der Anmeldung also ihre Mehrschirmfaehigkeit.

# --------------------------------------------------------------------
# Die Schirme
# --------------------------------------------------------------------
# DIE AUFFANGREGEL, UND SIE IST DIE EINZIGE, DIE HIER STEHEN KANN
#     Welche Ausgaenge diese Maschine hat, weiss zur Schreibzeit dieser
#     Datei niemand. Ein fest eingetragenes "eDP-1" oder "DP-1" waere
#     eine Behauptung ueber fremde Hardware.
#
#     Der leere Name ist Hyprlands Auffangregel - nicht ein Stern:
#     src/output/Monitor.cpp:1201-1211 (matchesStaticSelector) kennt nur
#     "desc:"-Praefixe und exakte Namensgleichheit, es gibt KEINE
#     Namensmuster. Was es gibt, steht in
#     src/config/shared/monitor/MonitorRuleManager.cpp:96-116: erst wird
#     eine Regel gesucht, deren Name auf den Ausgang passt, und erst wenn
#     keine passt, greift die mit leerem Namen.
monitor = , preferred, auto, 1

# UND DIE SPIEGELUNG STEHT NICHT HIER, SONDERN UNTEN ALS PROGRAMM
#     Sie MUSS ein Programm sein. `mirror` braucht den NAMEN des
#     Ausgangs, auf den gespiegelt wird
#     (src/config/legacy/ConfigManager.cpp:1345-1382 liest
#     `monitor = NAME, Aufloesung, Position, Skalierung, mirror, ZIEL`),
#     und dieser Name ist genau das, was hier niemand kennt. Die
#     Auffangregel kann kein Ziel benennen, weil sie fuer alle gilt.
#
#     src/bin/zepos-greeter-spiegel fragt den laufenden Compositor, wer
#     da ist, und setzt die Regeln dann - fuer beliebig viele, beliebig
#     benannte Ausgaenge.

# --------------------------------------------------------------------
# Die Tastatur - und die zwei leeren Zeilen, die ein Konto retten
# --------------------------------------------------------------------
# HIER WIRD EIN PASSWORT VERDECKT GETIPPT.
#
# src/bin/zepos-greeter loest die Belegung dieser Maschine aus
# /etc/vconsole.conf und /usr/share/systemd/kbd-model-map auf und legt
# sie in XKB_DEFAULT_LAYOUT und XKB_DEFAULT_VARIANT ab. Unter cage kam
# sie an, weil wlroots seine Belegung ueber libxkbcommon baut und
# libxkbcommon ohne Angabe XKB_DEFAULT_* liest.
#
# HYPRLAND TUT DAS NICHT VON SELBST. Seine Vorgabe fuer input:kb_layout
# ist nicht "leer", sondern "us" - src/config/values/ConfigValues.cpp:272
# der ausgelieferten Fassung:
#
#     MS<String>("input:kb_layout", "Appropriate XKB keymap parameter",
#                "us", {.refresh = ...})
#
# Eine Konfiguration, die kb_layout nicht ausdruecklich LEERT, stellt
# also jede Maschine auf die amerikanische Belegung. GEMESSEN am
# 01.09.2026 an Hyprland 0.56.2, verschachtelt, ueber
# `hyprctl devices -j`:
#
#     ohne input-Sektion,  XKB_DEFAULT_LAYOUT=de -> "English (US)"
#     kb_layout leer,      XKB_DEFAULT_LAYOUT=de -> "German"
#     kb_layout leer,      XKB_DEFAULT_LAYOUT=gb -> "English (UK)"
#
# Das ist derselbe Fehler, den das Installationsmedium schon einmal
# hatte: `xyz-abc`, auf einer deutschen Tastatur getippt, kam als
# `xzy/abc` an. Auf einem Anmeldebildschirm ist das kein kosmetischer
# Mangel - es ist ein Konto, in das der Besitzer nicht mehr hineinkommt,
# ohne dass irgendwo etwas gemeldet wuerde.
#
# tests/render/test_anmeldung_spiegel.py misst beide Zeilen an einem
# echten Compositor, mit "gb" und nicht nur mit "de": "de" ist die
# Belegung dieser Werkstatt, und ein Test, der sie prueft, faellt auch
# dann nicht durch, wenn die Umgebung gar nicht ankommt.
input {
    kb_layout =
    kb_variant =

    # Auf einem Anmeldebildschirm wird oft eine Zahl getippt. Dieselbe
    # Zeile steht in src/templates/hyprland-universal-config.template.
    numlock_by_default = true
    follow_mouse = 1
}

# --------------------------------------------------------------------
# Was die Maske umgibt: nichts
# --------------------------------------------------------------------
# DIESE DREI NULLEN SIND DER GRUND, WARUM DIE MASKE DEN SCHIRM FUELLT
#     regreet ist ein gewoehnliches Fenster, und Hyprland kachelt es.
#     Ein einzelnes gekacheltes Fenster fuellt genau dann den ganzen
#     Ausgang, wenn weder Rand noch Luecke etwas abziehen. cage brachte
#     dasselbe ueber seinen Vollbildmodus mit; hier steht es
#     ausgeschrieben, weil es hier eine Entscheidung ist.
#
#     tests/render/test_anmeldung_spiegel.py misst das an einem echten
#     Fenster in einem echten Compositor - nicht an diesen drei Zeilen.
general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
}

decoration {
    rounding = 0
    # Eine Anmeldemaske, die sich einblendet, ist eine Anmeldemaske, die
    # spaeter da ist. Aus, und zwar beides.
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0

    # Diese Datei gehoert root und aendert sich nicht, waehrend jemand
    # sich anmeldet. Ein Beobachter darauf waere Arbeit ohne Anlass.
    disable_autoreload = true

    # ROTE MELDUNG MITTEN AUF DEM ANMELDEBILDSCHIRM, OHNE DIESE ZEILE
    #
    # Hyprland 0.56 legt eine Einblendung in reinem Rot ueber den Schirm,
    # 15 Sekunden lang: "Hyprland was started without start-hyprland.
    # This is strongly discouraged unless you are in a debugging
    # environment." Der Nutzer hat sie am 02.09.2026 gemeldet. Sie ist
    # nicht falsch - zepos-greeter startet Hyprland tatsaechlich ohne
    # den offiziellen Starter - aber sie ist hier auch nicht zu befolgen.
    #
    # WARUM DER OFFIZIELLE STARTER HIER FALSCH WAERE. GEMESSEN am
    # 02.09.2026 am Quelltext der Fassung, die ZepOS ausliefert
    # (hyprland-0.56.1, start/src/main.cpp:107-121): der Starter ist eine
    # `while (true)`-Schleife. Endet Hyprland unsauber, schreibt er
    # "Hyprland exit not-cleanly, restarting", setzt safeMode und startet
    # Hyprland WIEDER. Genau darauf beruht aber der Rueckfall in
    # zepos-greeter: dass Hyprland sich beendet und das Skript danach
    # cage und zuletzt tuigreet versucht. Ein Wachhund davor macht aus
    # dem Rueckfall eine Schleife - aus einer roten Meldung wuerde ein
    # Anmeldebildschirm, der nie kommt.
    #
    # Der Optionsname ist nicht geraten. Compositor.cpp:879 und 903 der
    # ausgelieferten Fassung: die Einblendung erscheint bei
    # `!m_watchdogWriteFd.isValid() && !*PNOWATCHDOG`, und PNOWATCHDOG
    # ist `CConfigValue<Config::INTEGER>("misc:disable_watchdog_warning")`.
    #
    # WAS DIESE ZEILE NICHT ERLEDIGT: die zweite Einblendung, "You are
    # using the .conf config format, support for which will be removed in
    # Hyprland 0.57." Die haengt an Compositor.cpp:900 allein am
    # Konfigurationstyp CONFIG_LEGACY und hat keinen Schalter. Sie
    # verschwindet erst, wenn diese Datei eine Lua-Konfiguration ist.
    disable_watchdog_warning = true
}

# --------------------------------------------------------------------
# KEINE EINZIGE TASTENBINDUNG - UND [Strg]+[Alt]+[F2] GEHT TROTZDEM
# --------------------------------------------------------------------
# Der Nutzer zu cages -s: "ein Anmeldebildschirm, von dem aus
# [Strg]+[Alt]+[F2] nicht mehr geht, ist ein Rechner ohne Notausgang".
# Die Eigenschaft musste erhalten bleiben.
#
# Sie ist erhalten, und sie braucht hier keine Zeile. GEMESSEN am
# 01.09.2026 zweifach:
#
#   1. `hyprctl binds` meldet in einem Compositor ohne bind-Zeilen
#      GENAU NULL Bindungen. Es gibt also keine eingebaute Belegung, die
#      man versehentlich erben wuerde.
#   2. Der Konsolenwechsel ist trotzdem eingebaut und laeuft an den
#      Bindungen VORBEI: src/managers/KeybindManager.cpp:901-923
#      (handleVT) faengt die Tastensymbole XF86Switch_VT_1 bis _12 ab
#      und ruft m_aqBackend->session->switchVT(TTY). Aufgerufen wird das
#      aus handleInternalKeybinds (Zeile 928), und das steht in Zeile
#      377 VOR jeder Auswertung von Benutzerbindungen.
#
# Dass hier sonst nichts steht, ist ebenfalls Absicht: eine
# Anmeldemaske, aus der heraus sich ein Terminal oeffnen laesst, ist
# keine Anmeldemaske. Wer hier eine bind-Zeile ergaenzt, gibt sie jedem,
# der vor dem verschlossenen Rechner steht.

# --------------------------------------------------------------------
# Was gestartet wird
# --------------------------------------------------------------------
# ZWEI PROGRAMME, UND DIE REIHENFOLGE IST EGAL
#     Der Spiegel raeumt die Schirme auf und laeuft weiter, solange der
#     Compositor lebt; die Maske ist die Anmeldung selbst und beendet den
#     Compositor, wenn sie fertig ist.
#
# BEI NAMEN UND NICHT MIT PFAD, WEIL DAS DIE MESSBARE FORM IST
#     Hyprland startet jedes exec-once ueber `/bin/sh -c`
#     (src/config/supplementary/executor/Executor.cpp:171-213), und sh
#     loest einen blossen Namen ueber PATH auf. Genau das macht
#     src/bin/zepos-greeter schon mit cage, regreet und tuigreet, und
#     genau daran haengt, dass tests/src/test_login.py diese Skripte
#     ueberhaupt ausfuehren kann: der Test setzt PATH auf sein
#     Stub-Verzeichnis. Ein absoluter Pfad hier waere eine Zeile, die
#     kein Test je durchlaufen kann.
#
# WARUM DIE MASKE DEN COMPOSITOR SELBST BEENDEN MUSS
#     `cage -- programm` endete, wenn das Programm endete. Hyprland tut
#     das NICHT: src/main.cpp:44-52 setzt SA_NOCLDWAIT, die Kinder werden
#     also eingesammelt, ohne dass irgendwer sie beobachtet, und ein
#     Blick durch src/ findet kein waitpid auf ein exec-once. Ohne die
#     letzte Zeile in zepos-greeter-maske stuende hier ein leerer
#     Compositor, nachdem die Anmeldung fertig ist.
exec-once = zepos-greeter-spiegel
exec-once = zepos-greeter-maske
