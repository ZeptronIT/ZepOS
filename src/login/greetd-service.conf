# Drop-in fuer greetd.service - installiert nach
# /usr/lib/systemd/system/greetd.service.d/10-zepos.conf
#
# Der einzige Zweck: greetd auf die ZepOS-Konfiguration zeigen, ohne eine
# Datei zu besitzen, die dem Paket greetd gehoert. src/login/greetd.toml
# hat die Messung, die das erzwingt.
#
# DIE LEERE ExecStart-ZEILE IST NICHT DEKORATION
#     ExecStart ist in systemd eine Liste. Eine zweite Zeile HAENGT AN,
#     sie ersetzt nicht - greetd liefe dann zweimal, das zweite Mal gegen
#     ein bereits belegtes tty1. Die leere Zuweisung loescht die Liste,
#     und erst die Zeile danach ist der Aufruf, den diese Unit macht.
#
# WARUM /usr/lib UND NICHT /etc
#     /etc/systemd/system/greetd.service.d/ gehoert dem Administrator
#     dieser Maschine. Ein Paket, das dort ablegt, nimmt ihm den Ort weg,
#     an dem er ZepOS ueberstimmen koennte - und genau das soll moeglich
#     bleiben: ein Drop-in in /etc gewinnt gegen dieses hier.

[Service]
ExecStart=
ExecStart=greetd --config /etc/greetd/zepos.toml
