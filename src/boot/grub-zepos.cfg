# Das ZepOS-Startmenue auf einer Installation - installiert nach
# /etc/default/grub.d/10-zepos.cfg
#
# WARUM EIN DROP-IN UND NICHT /etc/default/grub
#     Die Hauptdatei gehoert dem Paket grub, und sie ist die Datei, an
#     der ein Administrator dreht. Gemessen an grub 2:2.14-1 - genau der
#     Fassung, die im angehefteten ALA-Schnappschuss 2026/08/04 unter
#     core liegt und die eine Installation also bekommt:
#
#         /usr/bin/grub-mkconfig, Zeile 160-167
#         if test -f ${sysconfdir}/default/grub ; then
#           . ${sysconfdir}/default/grub
#         fi
#         for dropin in ${sysconfdir}/default/grub.d/*.cfg ; do
#           if test -f "${dropin}" ; then . "${dropin}" ; fi
#         done
#
#     Das Drop-in wird also NACH der Hauptdatei gelesen und gewinnt,
#     ohne sie zu besitzen.
#
# BEIDE ZEILEN SIND NOETIG, UND DIE ERSTE IST DIE, DIE MAN VERGISST
#     /etc/grub.d/00_header umschliesst den ganzen Themenblock mit
#     `if [ "x$gfxterm" = x1 ]` (Zeile 271), und gfxterm wird nur dann
#     auf 1 gesetzt, wenn GRUB_TERMINAL_INPUT oder GRUB_TERMINAL_OUTPUT
#     das Wort "gfxterm" enthaelt (Zeilen 170-179). Arch liefert
#     GRUB_TERMINAL_OUTPUT auskommentiert aus, also ist die Variable
#     leer.
#
#     GRUB_THEME allein erzeugt damit KEINE einzige Zeile in grub.cfg -
#     kein `set theme`, kein `loadfont`, kein `insmod gfxmenu`. Das
#     Menue kaeme als weisse Schrift auf Schwarz hoch, und nichts wuerde
#     es melden: GRUB antwortet auf ein fehlendes Thema mit dem
#     Textmodus und ohne Fehler. iso/profile-release/grub/grub.cfg
#     schreibt denselben Satz fuer die andere Haelfte auf.
GRUB_TERMINAL_OUTPUT=gfxterm

# Das Thema selbst - UNTER /boot UND NICHT UNTER /usr/share.
#
# HIER STAND BIS ZUM 17.08.2026 /usr/share/grub/themes/zepos/theme.txt,
# UND DAS WAR DER GRUND, WARUM EINE INSTALLATION EIN NACKTES GRUB ZEIGTE
#     Der Absatz, der hier stand, sagte: "00_header ruft fuer den
#     Themenpfad prepare_grub_to_access_device auf und schreibt
#     daraufhin `insmod ext2` und ein `search --fs-uuid` auf die Wurzel -
#     GRUB liest das Thema also vom Wurzeldateisystem." Der Satz ist
#     falsch, sobald die Wurzel verschluesselt ist, und die Wurzel einer
#     ZepOS-Installation IST verschluesselt.
#
#     /etc/grub.d/00_header betritt den Themenblock nur, wenn ALLE DREI
#     Bedingungen halten (grub 2:2.14-1, Zeilen 271-273):
#
#         if [ "x$gfxterm" = x1 ]; then
#             if [ "x$GRUB_THEME" != x ] && [ -f "$GRUB_THEME" ] \
#                 && is_path_readable_by_grub "$GRUB_THEME"; then
#
#     Die ersten beiden hielten. Die dritte nicht.
#     is_path_readable_by_grub steht in /usr/share/grub/
#     grub-mkconfig_lib, Zeilen 77-85:
#
#         if [ x$GRUB_ENABLE_CRYPTODISK = xy ]; then
#             return 0
#         fi
#         for abstraction in $abstractions; do
#             if [ "x$abstraction" = xcryptodisk ]; then
#                 return 1
#             fi
#         done
#
#     GEMESSEN AM ABBILD DER INSTALLATION VOM 17.08.2026 (iso/out/
#     release-target.img, Wurzel ueber cryptsetup geoeffnet):
#
#         $ grub-probe -t abstraction .../usr/share/grub/themes/zepos/theme.txt
#         cryptodisk
#         luks2
#         gcry_rijndael
#         gcry_rijndael
#         gcry_sha256
#
#         $ grub-probe -t abstraction .../boot/grub/grub.cfg
#         (leer)
#
#     und /etc/default/grub der Zielplatte fuehrt
#     `#GRUB_ENABLE_CRYPTODISK=y` auskommentiert. Also: `cryptodisk` in
#     der Liste, kein Freibrief, `return 1` - und der ganze Block wird
#     uebersprungen. Ohne Fehler, ohne Warnung, ohne eine Zeile in
#     grub.cfg. Die erzeugte /boot/grub/grub.cfg des Laufs vom
#     17.08.2026 enthielt null Vorkommen von `theme`.
#
#     DIESELBE BEDINGUNG HAT AUCH DIE SCHRIFT VERSCHLUCKT, und das ist
#     der Gegenbeweis dafuer, dass es am Thema selbst gelegen haette:
#     /usr/share/grub/unicode.pf2 liegt auf der Zielplatte (2412513
#     Bytes), 00_header sucht sie in Zeile 197-207 ueber genau dieselbe
#     Pruefung, und die grub.cfg desselben Laufs bekam trotzdem nur den
#     Rueckfall `if loadfont unicode ; then`. Alles auf der
#     verschluesselten Wurzel ist fuer grub-mkconfig unlesbar.
#
# WARUM DER AUSWEG NICHT GRUB_ENABLE_CRYPTODISK=y HEISST
#     Weil er das Menue nicht schoener machte, sondern eine zweite
#     Passphrase davorsetzte. Mit dem Schalter schriebe
#     prepare_grub_to_access_device ein `cryptomount` in die grub.cfg,
#     und GRUB muesste die LUKS2-Partition aufschliessen, BEVOR es das
#     Menue zeichnen kann - in nacktem Text, ohne Thema, und mit einer
#     argon2id-Ableitung, die GRUB in Software rechnet. Der Nutzer
#     tippte die Passphrase zweimal, die erste davon in genau dem
#     schwarzen Kasten, den dieses Thema ersetzen soll.
#
# WARUM /boot DIE EINZIGE RICHTIGE STELLE IST
#     Weil /boot per Definition das Dateisystem ist, aus dem GRUB liest.
#     Dort liegt grub.cfg, dort liegen die Module - ein /boot, das GRUB
#     nicht lesen kann, ist eine Maschine, die nicht startet. Was immer
#     eine Installation als /boot hat, ist damit lesbar; auf einer
#     ZepOS-Installation ist es die EFI-Partition (fat32, gemessen am
#     Abbild: `grub-probe -t fs` sagt `fat`, die Abstraktionsliste ist
#     leer). Der Pfad hier ist deshalb nicht eine Vorliebe, sondern der
#     einzige, der die dritte Bedingung erfuellen KANN.
#
# UND DAS PAKET LEGT TROTZDEM NICHTS AUF DIE FAT-PARTITION
#     Der alte Absatz hatte damit recht: ein Paket, das Dateien auf FAT
#     ablegt, verliert deren Rechte und Besitzer und legt sie neben die
#     Wurzel, wenn /boot einmal nicht eingehaengt ist. zepos-config
#     liefert das Thema deshalb weiter nach /usr/share/grub/themes/zepos
#     aus - das bleibt der Bestand, der dem Paket gehoert - und ein
#     ALPM-Haken spiegelt es von dort nach /boot. src/boot/
#     zepos-grub-theme traegt die Begruendung und die Reihenfolge.
#     Genau so macht es grub-install mit seinem eigenen Thema: unter
#     /usr/share/grub/themes/starfield liegt der Bestand, unter
#     /boot/grub/themes/starfield die Kopie, die gelesen wird (beide am
#     17.08.2026 auf der Zielplatte gefunden).
GRUB_THEME=/boot/grub/themes/zepos/theme.txt

# Und der Name im Menue.
#
# Gemessen an der ersten Installation, die durchlief: das Menue kam in
# den Farben von ZepOS hoch, mit der Wortmarke darueber - und der
# ausgewaehlte Eintrag hiess "Arch Linux". Der kommt aus
# /etc/grub.d/10_linux, Zeile 30-35:
#
#     if [ "x${GRUB_DISTRIBUTOR}" = "x" ] ; then
#       OS=Linux
#     else
#       OS="${GRUB_DISTRIBUTOR} Linux"
#
# und Archs /etc/default/grub setzt GRUB_DISTRIBUTOR="Arch". Ein Menue,
# das oben ZepOS sagt und in der Zeile darunter Arch, ist ein Menue, das
# der Nutzer zu Recht nicht als seins erkennt.
#
# " Linux" haengt 10_linux ohne Umweg an, es gibt dafuer keinen zweiten
# Schalter - der Eintrag heisst also "ZepOS Linux", so wie er auf jeder
# anderen Distribution "<Name> Linux" heisst. Der Untermenue-Titel
# ("Advanced options for ...") folgt derselben Variablen.
GRUB_DISTRIBUTOR="ZepOS"

# Und die Zeile, die aus der Passphrase-Abfrage ein Bild macht.
#
# WARUM `splash` NOETIG IST, obwohl der plymouth-Haken plymouthd
# bedingungslos startet
#     Gemessen am Paket extra/plymouth 26.134.222-2 aus dem angehefteten
#     ALA-Schnappschuss 2026/08/04: usr/lib/initcpio/hooks/plymouth ruft
#     `plymouthd --mode=boot` und `plymouth show-splash` ohne jede
#     Abfrage - der Haken selbst sieht die Kernelzeile nie an. plymouthd
#     tut es: ohne `splash` in /proc/cmdline zeichnet es das
#     details-Plugin, also eine mitlaufende Textliste, und nicht das
#     Thema. Der Haken allein ergaebe damit dieselbe Textzeile wie
#     vorher, nur mit einem Dienst mehr dahinter.
#
# WARUM `loglevel=3 quiet` DAZU
#     Beides steht in Archs Vorgabe schon (`GRUB_CMDLINE_LINUX_DEFAULT=
#     "loglevel=3 quiet"`, gemessen an grub 2:2.14-1, etc/default/grub
#     Zeile 6), und diese Zeile ERSETZT die Vorgabe, statt sie zu
#     ergaenzen - grub-mkconfig liest das Drop-in nach der Hauptdatei
#     und die Zuweisung gewinnt. Wer hier nur "splash" schriebe, naehme
#     der Installation ihr `quiet` weg und bekaeme die Kernelmeldungen
#     zurueck, also genau das Flackern, das dieses Bild vermeiden soll.
#
# WARUM NICHT GRUB_CMDLINE_LINUX
#     Dort steht archinstalls `cryptdevice=UUID=...:root` (installer/
#     core/crypt.py hat die Messung). Die zwei Variablen sind getrennt,
#     /etc/grub.d/10_linux haengt beide aneinander, und eine Zuweisung
#     auf die falsche der beiden loeschte den Parameter, ohne den die
#     verschluesselte Wurzel gar nicht erst gesucht wird.
GRUB_CMDLINE_LINUX_DEFAULT="loglevel=3 quiet splash"
